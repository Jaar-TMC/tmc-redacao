name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'FeedRSS/**'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'FeedRSS/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: backend-test-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: FeedRSS/tmc-rss-collector
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: FeedRSS/tmc-rss-collector/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        env:
          PRODUCTION_SAFETY_MODE: "false"
          JWT_SECRET_KEY: "test-secret-key-for-ci-minimum-32chars"
          SQL_SERVER: "dummy"
          SQL_DATABASE: "dummy"
          SQL_USERNAME: "dummy"
          SQL_PASSWORD: "dummy"
        run: python -m pytest tests/ -v --tb=short

  deploy:
    name: Deploy to Azure Functions
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: backend-deploy
      cancel-in-progress: false
    environment: production
    defaults:
      run:
        working-directory: FeedRSS/tmc-rss-collector
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: FeedRSS/tmc-rss-collector/requirements.txt

      - name: Resolve Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: 'tmc-redacao-api'
          package: 'FeedRSS/tmc-rss-collector'
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: true

      - name: Post-deploy health check
        id: healthcheck
        run: |
          sleep 60
          HEALTH_URL="https://tmc-redacao-api-b7h3dyaxazfvdcez.eastus2-01.azurewebsites.net/api/health"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$HEALTH_URL")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              curl -s "$HEALTH_URL" | python3 -m json.tool
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS, retrying in 20s..."
            sleep 20
          done
          echo "Health check failed after 5 attempts"
          exit 1

      - name: Alert on health check failure
        if: failure() && steps.healthcheck.outcome == 'failure'
        run: |
          echo "::error::Health check failed. The deployment completed but the app is not responding."
          echo "::error::Manual action required: verify the deployment at Azure Portal or roll back."
